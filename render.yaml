# Render Blueprint cho backend. Tại render.com: New -> Blueprint -> chọn repo này ->
# Render tự đọc file này. Frontend KHÔNG deploy bằng file này -- deploy riêng qua
# Vercel (xem DEPLOY.md), vì Vercel host static site tốt hơn Render cho việc đó.

services:
  - type: web
    name: edumind-ai-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: mock
      - key: QDRANT_PATH
        value: /tmp/qdrant_local
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: CORS_ORIGINS
        value: "http://localhost:5173"   # THAY bằng URL Vercel thật sau khi deploy frontend (xem DEPLOY.md bước 4)
